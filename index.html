<!DOCTYPE html>
<html>
<head>
    <title>Bubble sort</title>

    <style>
        .Box {
            width: 30px;
            height: 20px;
            display: inline-block;
            align-self: center;
            align-items: center;
            margin: 5px;
            background-color: antiquewhite;  
            text-align:center ;
            font-family: 'S0egoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: black;
            user-select: none;        
            -webkit-user-select: none; 
            -moz-user-select: none;    
            -ms-user-select: none;  
        }
        .BoxContainer {
            position: relative;
            align-self: center;
            position:relative;
            align-items: center;
            justify-content: center;
            min-height: 5vh;
            display: flex;
        }
        .Button {
        position: absolute;
        inset: 0;
        margin: 100px auto 0 auto;

        display: flex;
        justify-content: center;
        align-items: center;

        width: 60px;
        height: 20px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: green;
        color: aliceblue;
        user-select: none;        
        -webkit-user-select: none; 
        -moz-user-select: none;    
        -ms-user-select: none;
        }
    </style>
</head>

<body> 
    <h3 align="center" style="font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif ;">
        Bubble Sort
    </h3>

    <div id="BoxContainer"></div>
    <div id="Button"></div>

    <script>
    const Wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const Button = document.getElementById("Button")
    const AmountofNumbers = 10
    let FinishedAnimation = false

    Button.className = "Button"
    Button.textContent = "Sort"

    let NumberList = [

    ];

    for (let i = 0; i < AmountofNumbers; i++) {
        NumberList[i] = Math.floor(Math.random() * 100)
    }

    const Box = document.getElementById("BoxContainer");
    Box.className = "BoxContainer"

    async function Count(){
        for (let i = 0; i < AmountofNumbers; i++) {
        const NewBox = document.createElement("div");
        NewBox.className = "Box";
        Box.append(NewBox);
        NewBox.setAttribute("name", "BoxNumber"+i)

        for (let k = 0; k <= NumberList[i]; k++) {
            NewBox.textContent = k
            await Wait(5)
        }
        }
        FinishedAnimation = true
        console.log(FinishedAnimation)
    }
   
    Count()

    let hovering = false

    async function CompareNumber(Number1, Number2, ListPlace) {
        Number1.style.backgroundColor = "blue"
        Number2.style.backgroundColor = "blue"
        await Wait(300)
        if (Number(Number1.textContent) > Number(Number2.textContent)) {
            Number1.textContent = Number2.textContent
            Number2.textContent = NumberList[ListPlace]
            NumberList[ListPlace] = Number1.textContent
            NumberList[ListPlace+1] = Number2.textContent
        }
        await Wait(300) 
        Number1.style.backgroundColor = "antiquewhite"
        Number2.style.backgroundColor = "antiquewhite"
        return
    }

    async function ButtonActivation() {
        const BoxContainer = document.getElementById("BoxContainer")
        let Safe = AmountofNumbers-1
        let SafetyNet = 1

        if (FinishedAnimation == true) {
            for (let idk = 0; idk <= AmountofNumbers; idk++) {
                for (let k = 0; k < AmountofNumbers-SafetyNet; k++) {

                    if (AmountofNumbers-SafetyNet == 1) {
                        const LastContainer = BoxContainer.querySelector(`[name="BoxNumber${0}"]`)
                        const LastContainer2 = BoxContainer.querySelector(`[name="BoxNumber${1}"]`)

                        LastContainer.style.backgroundColor="green"
                        LastContainer2.style.backgroundColor="green"
                        return
                    } else {
                        await CompareNumber(BoxContainer.querySelector(`[name="BoxNumber${k}"]`), BoxContainer.querySelector(`[name="BoxNumber${k+1}"]`), k)
                        await Wait(300) 
                    }

                }

            const LastContainer = BoxContainer.querySelector(`[name="BoxNumber${Safe}"]`)
            Safe -= 1
            SafetyNet += 1
            LastContainer.style.backgroundColor="green"
            }
        }
    }

    function ButtonHover() {

        if (FinishedAnimation == false) {
            if (hovering == false) {
                Button.addEventListener("mouseleave", ButtonHover)
                hovering = true
                return
            }
            if (hovering == true) {
                Button.addEventListener("mouseenter", ButtonHover)
                hovering = false
                return
            }

        }

        if (hovering == false) {
            Button.style.backgroundColor = "greenyellow"
            Button.style.width = "70px"
            Button.style.height = "25px"

            Button.addEventListener("mouseleave", ButtonHover)
            hovering = true
        }
        else {
            Button.style.backgroundColor = "green"
            Button.style.width = "60px"
            Button.style.height = "20px"

            Button.addEventListener("mouseenter", ButtonHover)
            hovering = false
        }
    }

    Button.addEventListener("mouseenter", ButtonHover)
    Button.addEventListener("click", ButtonActivation)

    </script>
</body>
</html>
