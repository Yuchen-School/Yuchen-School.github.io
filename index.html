    }
    )

    ExitQuiz.addEventListener("click", (event) => {
        if (event.isTrusted == true) {
            Test.style.backgroundColor = "greenyellow"
            ExitQuiz.style.backgroundColor = "rgb(150, 50, 50)"
            QuizFrame.classList.add("QuizDeActivate")
            QuizFrame.classList.remove("QuizActivate")

            Choice1.style.backgroundColor = "rgb(193, 207, 234)"
            Choice2.style.backgroundColor = "rgb(193, 207, 234)"
            Choice3.style.backgroundColor = "rgb(193, 207, 234)"
            Choice4.style.backgroundColor = "rgb(193, 207, 234)"


            Debounce = true
            WaitForAnimation()
        }
    }
    )

    //Hover functions\\

    Test.addEventListener("mouseenter", (event) => {
        Test.style.backgroundColor = "rgb(120, 180, 120)"
    }
    )

    Test.addEventListener("mouseleave", (event) => {
        Test.style.backgroundColor = "greenyellow"
    }
    )

    ExitQuiz.addEventListener("mouseenter", (event) => {
        ExitQuiz.style.backgroundColor = "rgb(200, 120, 120)"
    }
    )

    ExitQuiz.addEventListener("mouseleave", (event) => {
        ExitQuiz.style.backgroundColor = "rgb(216, 89, 89)"
    }
    )

    function Hover(onoroff, thing) {
        if (onoroff == true) {
            thing.style.backgroundColor = "rgb(160, 175, 200)"
        } else {
            thing.style.backgroundColor = "rgb(193, 207, 234)"
        }
    }

    function Click(thing) {
        if (thing.style.height == "15%") {
            thing.style.backgroundColor = "rgb(100, 180, 100)"
            thing.textContent = "CORRECT!"
            SolveQuestion()
        } else {
            thing.style.backgroundColor = "rgb(180, 100, 100)"
            thing.textContent = "INCORRECT!"
        }
    }

    </script>
</body>


</html>
