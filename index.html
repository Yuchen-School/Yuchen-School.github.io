<!DOCTYPE html>
<!-- Poochenyprojects -->

<html>

<head>
    <title>idk yet</title>

    <style>
    
    html, body {
    margin: 0;
    padding: 0;
    overflow: hidden; 
    height: 100%;     
    }   
    .PlayableArea {
        background-color: aliceblue;
        position:relative;
        align-self: center;
        display: flex;
        margin: auto;   
    }
    .Screen {
        position:relative;
        align-self: center;
        display: flex;
        margin: auto;   
    }
    .Stats {
        background-color: beige;
        position: absolute;
        display: contents;
    }
    .Player {
        background-color: lightgreen;
        position: absolute;
        border-radius: 50%;
    }
    .DamagePart {
        background-color: red;
        position:relative;
        border-radius: 50%;
    }
    .RewardPart {
        background-color: yellow;
        border-radius: 50%;
        position:relative;
    }
    </style>
</head>

<body>

<div id="Stats"></div>
<div id="Player"></div>
<div id="PlayableArea"></div>
<div id="PositionChecker"></div>
<div id="ScreenChecker"></div>

<script>

//Multiple use functions that I use multiple times for convenience\\

function comparePercentages(pct1, pct2) {
    return parseFloat(pct1) < parseFloat(pct2);
}

const Wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

//Initiate the things needed\\

const ScreenChecker = document.getElementById("ScreenChecker")
ScreenChecker.className = "Screen"
ScreenChecker.style.height = "100%"
ScreenChecker.style.width = "100%"

const PlayableArea = document.getElementById("PlayableArea")
PlayableArea.className = "PlayableArea"
PlayableArea.style.height = "100%"
PlayableArea.style.width = "80%"

const StatBar = document.getElementById("Stats")
StatBar.className = "Stats"
PlayableArea.append(StatBar)
StatBar.style.left = "10%"
StatBar.style.height = "10%"
StatBar.style.width = "10%"

const Player = document.getElementById("Player")
PlayableArea.append(Player)
Player.className = "Player"
Player.style.top = "0%"
Player.style.left = "0%"

//Variable setup\\

let CurrentTop = 50
let CurrentLeft = 50

Player.style.top = CurrentTop + "%"
Player.style.left = CurrentLeft + "%"

let WKey = false
let SKey = false
let AKey = false
let DKey = false

const SetMovementSpeed = 0.5
let MovementSpeed = SetMovementSpeed

//Function for keeping things scaled properly\\

async function KeepEverythingToScale() {
    let TopSize = ScreenChecker.offsetHeight
    let LeftSize = ScreenChecker.offsetLeft

    let LastTop = 0
    let LastLeft = 0
    while (true) {
        await Wait(10)
        TopSize = ScreenChecker.offsetHeight
        LeftSize = ScreenChecker.offsetWidth

        if (LastTop != TopSize || LastLeft != LeftSize) {
            
            if (TopSize > LeftSize) {
                PlayableArea.style.height = (LeftSize/TopSize)*100 + "%"
                PlayableArea.style.width = ScreenChecker.style.width + "%"
            } else if (TopSize < LeftSize) {
                PlayableArea.style.width = (TopSize/LeftSize)*100 + "%"
                PlayableArea.style.height = ScreenChecker.style.height + "%"
            }

            Player.style.height = PlayableArea.offsetHeight*0.08 + "px"
            Player.style.width = PlayableArea.offsetHeight*0.08 + "px"
        }

        LastTop = TopSize
        LastLeft = LeftSize
    }
}

KeepEverythingToScale()

//Main movement control system\\
    //Forwards and Backwards (W and S) control the hypotenuse balancing\\

async function MoveDirection(Direction, Amount, type) {
    if (Direction == "W") {
        WKey = type

        while (WKey == true) {

            //Check if the player is moving by pythagoras\\
            if (WKey && (AKey || DKey)) {MovementSpeed = SetMovementSpeed/Math.sqrt(2)} else {MovementSpeed = SetMovementSpeed}

            await Wait(10)
            if (CurrentTop < 0) {break}
            CurrentTop -= Number(MovementSpeed)
            Player.style.top = CurrentTop + "%"
        }
        MovementSpeed = SetMovementSpeed

    } if (Direction == "S") {
        SKey = type

        while (SKey == true) {
            //Check if the player is moving by pythagoras\\
            if (SKey && (AKey || DKey)) {MovementSpeed = SetMovementSpeed/Math.sqrt(2)} else {MovementSpeed = SetMovementSpeed}

            await Wait(10)
            if (comparePercentages(Player.style.top, "95%") == false) {break}
            CurrentTop += Number(MovementSpeed)
            Player.style.top = CurrentTop + "%"
        }
        MovementSpeed = SetMovementSpeed            

    } if (Direction == "A") {
        AKey = type

        while (AKey == true) {
            await Wait(10)
            if (CurrentLeft < 0) {break}
            CurrentLeft -= Number(MovementSpeed)
            Player.style.left = CurrentLeft + "%"
        }
    } if (Direction == "D") {
        DKey = type

        while (DKey == true) {
            await Wait(10)
            if (comparePercentages(Player.style.left, "95%") == false) {break}
            CurrentLeft += Number(MovementSpeed)
            Player.style.left = CurrentLeft + "%"
        }
    }
}

    //Movement Control: Key down\\
document.addEventListener("keydown", (event) => {

    if (event.key == "w" || event.key == "W" || event.key == "ArrowUp") {
        if (WKey == true) {return}
        MoveDirection("W", MovementSpeed, true)
    } else if (event.key == "s" || event.key == "S" || event.key == "ArrowDown") {
        if (SKey == true) {return}
        MoveDirection("S", MovementSpeed, true)
    } else if (event.key == "a" || event.key == "A" || event.key == "ArrowLeft") {
        if (AKey == true) {return}
        MoveDirection("A", MovementSpeed, true)
    } else if (event.key == "d" || event.key == "D" || event.key == "ArrowRight") {
        if (DKey == true) {return}
        MoveDirection("D", MovementSpeed, true)
    }
}
)
    //Movement Control: Key up\\
document.addEventListener("keyup", (event) => { 

        if (event.key == "w" || event.key == "W" || event.key == "ArrowUp") {
            MoveDirection("W", MovementSpeed, false)
        } else if (event.key == "s" || event.key == "S" || event.key == "ArrowDown") {
            MoveDirection("S", MovementSpeed, false)
        } else if (event.key == "a" || event.key == "A" || event.key == "ArrowLeft") {
            MoveDirection("A", MovementSpeed, false)
        } else if (event.key == "d" || event.key == "D" || event.key == "ArrowRight") {
            MoveDirection("D", MovementSpeed, false)
        }
}
)
</script>

</body>
</html>
